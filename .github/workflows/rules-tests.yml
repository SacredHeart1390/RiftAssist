name: RiftAssist rules tests

on:
  push:
    paths:
      - 'experiments/unified-rulings/releases/**'
      - 'experiments/unified-rulings/tests/**'
      - '.github/workflows/rules-tests.yml'
  pull_request:
    paths:
      - 'experiments/unified-rulings/releases/**'
      - 'experiments/unified-rulings/tests/**'
      - '.github/workflows/rules-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rules-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  event-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let run=true;
          if(process.env.GITHUB_EVENT_NAME==='push'){
            const [owner]=process.env.GITHUB_REPOSITORY.split('/');
            const url='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/pulls?state=open&head='+encodeURIComponent(owner+':'+process.env.GITHUB_REF_NAME)+'&per_page=1';
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN}});
            if(!r.ok)throw Error('PR state check failed');run=(await r.json()).length===0;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+run+'\n');
          JS
  rules-tests:
    needs: event-gate
    if: needs.event-gate.outputs.run == 'true'
    name: Rules regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/unified-rulings/tests
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          # Tests use only Node built-ins; no dependency installation or cache is needed.
          package-manager-cache: false
      - name: Run mocked rules regression tests
        run: npm test
      - name: Cross-version cards AI and reports (synthetic only)
        run: npm run test:compat
      - name: Verify unchanged v0.1.7 compatibility
        run: npm run test:legacy

  browser-compatibility:
    needs: event-gate
    if: needs.event-gate.outputs.run == 'true'
    name: Browser mobile PWA and maintenance compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/unified-rulings/tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install pinned browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Exercise synthetic browser mobile PWA and release transition flows
        run: npm run test:e2e

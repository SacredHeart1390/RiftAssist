name: Control Center validation
on:
  push:
    branches: [feature/riot-api-v0.2, release/v0.2.0, develop/v0.3.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-center-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/unified-rulings/control-center
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare loopback-only SSH fixture
        run: |
          python -m pip install paramiko==4.0.0
          "RIFTASSIST_CC_LOOPBACK_PYTHON=$((Get-Command python).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check public protocol vectors and backend payload
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/protocol-vectors.cjs
          node scripts/console-instructions.cjs
          node scripts/one-line-inspection.cjs
          node scripts/final-inspection.cjs
          node --test scripts/final-inspection.test.cjs
          node scripts/one-shot-release.test.cjs
          ./scripts/Test-ConsoleInstructions.ps1
          ./scripts/Test-OneLineInspection.ps1
          ./scripts/Test-FinalInspection.ps1
          node scripts/backend-manifest.cjs
          python scripts/verify-icon.py
          node scripts/deployment-manifest.cjs
          node scripts/staging-manifest.cjs
          python staging/inspection.test.py
          python staging/replacement-inspection.test.py
          python staging/legacy-inspection.test.py
          python scripts/audit-v017-baseline.py
          python scripts/preparation.test.py
          python scripts/one-shot-install.test.py
          python staging/release-blockers.test.py
          python staging/maintenance-metadata.test.py
          python staging/launch-details.test.py
          python staging/final-inspection.test.py
          node --test --test-reporter=tap deployment/lab.test.cjs
          node --test --test-reporter=tap staging/staging.test.cjs
          node --test --test-reporter=tap staging/replacement.test.cjs staging/replacement-hardening.test.cjs
      - name: Run Windows synthetic application and legacy compatibility contracts
        run: |
          npm --prefix ../tests test
          if ($LASTEXITCODE -ne 0) { throw 'Windows application regressions failed.' }
          npm --prefix ../tests run test:compat
          if ($LASTEXITCODE -ne 0) { throw 'Windows version compatibility matrix failed.' }
          npm --prefix ../tests run test:legacy
          if ($LASTEXITCODE -ne 0) { throw 'Windows legacy regressions failed.' }
      - name: Build native WPF target
        run: dotnet build src/RiftAssist.ControlCenter/RiftAssist.ControlCenter.csproj --configuration Release
      - name: Run C# protocol and mock Node integration proofs
        run: |
          $node = (Get-Command node).Source
          dotnet run --project tests/RiftAssist.ControlCenter.Tests/RiftAssist.ControlCenter.Tests.csproj --configuration Release -- ../releases/v0.2.0 $node "$env:RUNNER_TEMP/control-center-proof.json"
      - name: Load WPF window on the Windows runner
        run: dotnet run --project tests/RiftAssist.ControlCenter.WpfSmoke/RiftAssist.ControlCenter.WpfSmoke.csproj --configuration Release -- "$env:RUNNER_TEMP/control-center-smoke"
      - name: Build portable development package
        run: |
          $node = (Get-Command node).Source
          ./scripts/Publish-Windows.ps1 -NodePath $node -OutputDirectory "$env:RUNNER_TEMP/RiftAssist-ControlCenter-win-x64"
      - name: Verify ZIP root layout and extract the exact package for execution tests
        run: |
          ./scripts/Test-PackageLayout.ps1 -PackageDirectory "$env:RUNNER_TEMP/RiftAssist-ControlCenter-win-x64" -ArchivePath "$env:RUNNER_TEMP/RiftAssist-ControlCenter-v0.2.0-win-x64.zip" -ExtractDirectory "$env:RUNNER_TEMP/RiftAssist-ControlCenter-verified" -ReportPath "$env:RUNNER_TEMP/control-center-layout.json"
      - name: Verify packaged backend and runtime through the C# client
        run: |
          $bundle = "$env:RUNNER_TEMP/RiftAssist-ControlCenter-verified"
          dotnet run --project tests/RiftAssist.ControlCenter.Tests/RiftAssist.ControlCenter.Tests.csproj --configuration Release -- "$bundle/backend/v0.2.0" "$bundle/runtime/node.exe" "$env:RUNNER_TEMP/control-center-packaged-proof.json" "$bundle/backend-manifest.json"
      - name: Inspect actual EXE signature and embedded non-elevating manifest
        run: ./scripts/Test-Publisher.ps1 -Executable "$env:RUNNER_TEMP/RiftAssist-ControlCenter-verified/RiftAssist.ControlCenter.exe" -ReportPath "$env:RUNNER_TEMP/control-center-publisher.json"
      - name: Start and close the actual packaged native executable
        run: |
          $executable = Join-Path $env:RUNNER_TEMP 'RiftAssist-ControlCenter-verified/RiftAssist.ControlCenter.exe'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class PackageIcons {
            [DllImport("shell32.dll", CharSet=CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, IntPtr[] big, IntPtr[] small, uint count);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool DestroyIcon(IntPtr icon);
          }
          '@
          $big = New-Object IntPtr[] 1; $small = New-Object IntPtr[] 1
          if ([PackageIcons]::ExtractIconEx($executable,0,$big,$small,1) -lt 1 -or $big[0] -eq [IntPtr]::Zero -or $small[0] -eq [IntPtr]::Zero) { throw 'Explorer executable icon resource is missing.' }
          [void][PackageIcons]::DestroyIcon($big[0]); [void][PackageIcons]::DestroyIcon($small[0])
          $owned = Start-Process -FilePath $executable -PassThru
          try {
            if (!$owned.WaitForInputIdle(15000)) { throw 'Packaged native window did not become idle.' }
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $owned.Refresh()
              if ($owned.HasExited) { throw 'Packaged application exited before its main window.' }
              if ($owned.MainWindowHandle -ne [IntPtr]::Zero) { break }
              Start-Sleep -Milliseconds 100
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($owned.MainWindowHandle -eq [IntPtr]::Zero -or $owned.MainWindowTitle -notlike 'RiftAssist Control Center*') { throw 'Expected packaged native window was not found.' }
            $windowBig = [PackageIcons]::SendMessage($owned.MainWindowHandle,0x007F,[IntPtr]1,[IntPtr]::Zero)
            $windowSmall = [PackageIcons]::SendMessage($owned.MainWindowHandle,0x007F,[IntPtr]::Zero,[IntPtr]::Zero)
            if ($windowBig -eq [IntPtr]::Zero -or $windowSmall -eq [IntPtr]::Zero) { throw 'Window/taskbar icon handles are missing.' }
            $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($owned.Id)")
            if ($children.Count -ne 0) { throw 'Opening the app must not auto-start Node, SSH or a browser.' }
            if (!$owned.CloseMainWindow() -or !$owned.WaitForExit(15000)) { throw 'Packaged native window did not close cleanly.' }
            if ($owned.ExitCode -ne 0) { throw 'Packaged application returned a failing exit code.' }
            $report = @{ packagedNativeExeStarted = $true; explorerIconResource = $true; windowAndTaskbarIcons = $true; closedCleanly = $true; automaticChildProcesses = 0; realAzureConnections = 0; os = $PSVersionTable.OS } | ConvertTo-Json
            [IO.File]::WriteAllText("$env:RUNNER_TEMP/control-center-native-package.json", $report)
            Write-Output $report
          } finally {
            if (!$owned.HasExited) { $owned.Kill($true) }
            $owned.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: RiftAssist-ControlCenter-v0.2.0-win-x64
          path: ${{ runner.temp }}/RiftAssist-ControlCenter-verified/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RiftAssist-ControlCenter-phase8-validation
          path: |
            ${{ runner.temp }}/control-center-layout.json
            ${{ runner.temp }}/control-center-proof.json
            ${{ runner.temp }}/control-center-packaged-proof.json
            ${{ runner.temp }}/control-center-native-package.json
            ${{ runner.temp }}/control-center-publisher.json
            ${{ runner.temp }}/control-center-smoke/
          if-no-files-found: error

  ubuntu-ssh-script-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/unified-rulings/control-center
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare synthetic loopback SSH server
        run: |
          python -m pip install paramiko==4.0.0
          node scripts/deployment-manifest.cjs
          node scripts/staging-manifest.cjs
          node --test scripts/final-inspection.test.cjs
          node scripts/one-shot-release.test.cjs
          python staging/inspection.test.py
          python staging/replacement-inspection.test.py
          python staging/legacy-inspection.test.py
          python scripts/audit-v017-baseline.py
          python scripts/preparation.test.py
          python scripts/one-shot-install.test.py
          python staging/release-blockers.test.py
          python staging/maintenance-metadata.test.py
          python staging/launch-details.test.py
          python staging/final-inspection.test.py
          node --test --test-reporter=tap deployment/lab.test.cjs
          node --test --test-reporter=tap staging/staging.test.cjs
          node --test --test-reporter=tap staging/replacement.test.cjs staging/replacement-hardening.test.cjs
      - name: Ubuntu POSIX script and OpenSSH loopback regressions (no Azure)
        run: |
          RIFTASSIST_CC_LOOPBACK_PYTHON="$(command -v python)" dotnet run --project tests/RiftAssist.ControlCenter.Tests/RiftAssist.ControlCenter.Tests.csproj --configuration Release -- ../releases/v0.2.0 "$(command -v node)" "$RUNNER_TEMP/control-center-ubuntu-proof.json"
      - name: Real isolated app systemd Caddy HTTPS backup and routing rollback (synthetic data only)
        run: |
          sudo apt-get update -qq
          mkdir -p "$RUNNER_TEMP/riftassist-caddy-package"
          cd "$RUNNER_TEMP/riftassist-caddy-package"
          apt-get download caddy
          dpkg-deb -x ./*.deb unpacked
          cd "$GITHUB_WORKSPACE/experiments/unified-rulings/control-center"
          sudo env RIFTASSIST_TEST_CADDY="$RUNNER_TEMP/riftassist-caddy-package/unpacked/usr/bin/caddy" RIFTASSIST_STAGING_PROOF="$RUNNER_TEMP/control-center-real-staging-proof.json" "$(command -v node)" staging/integration.cjs --systemd
      - name: Single service stop backup replace and rollback with unchanged Caddy (synthetic data only)
        run: |
          sudo env RIFTASSIST_TEST_CADDY="$RUNNER_TEMP/riftassist-caddy-package/unpacked/usr/bin/caddy" RIFTASSIST_REPLACEMENT_PROOF="$RUNNER_TEMP/control-center-replacement-proof.json" "$(command -v node)" staging/replacement-integration.cjs --systemd
      - name: Build reviewed code-only manual release capsule (no broker installation)
        run: |
          node - "$RUNNER_TEMP/RiftAssist-v0.2.0-manual-release" "$GITHUB_SHA" <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const out=process.argv[2],commit=process.argv[3];
          const proof=require('./staging/replacement-package.cjs').prepare('../releases/v0.2.0',out,{siteId:crypto.randomUUID(),commit,mode:'manual-ssh'});
          const temp=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'riftassist-schema-'));
          try {
            require('../releases/v0.2.0/src/operations-store.js').createStore(temp).close();
            const db=new(require('node:sqlite').DatabaseSync)(path.join(temp,'private/operations.sqlite'),{readOnly:true});
            try{proof.expectedSchemaHash=require('./staging/data-compatibility.cjs').schemaHash(db);}finally{db.close();}
          } finally {fs.rmSync(temp,{recursive:true,force:true});}
          const plan=JSON.parse(fs.readFileSync(path.join(out,'INSTALLATION-PLAN.json'))),profile=JSON.parse(fs.readFileSync('staging/replacement-inventory.example.json'));
          Object.assign(profile,{siteId:plan.siteId,root:path.dirname(plan.targets.siteTools),candidateData:plan.targets.newData,candidateCode:plan.targets.candidate,launcher:plan.targets.siteTools+'/replacement-launch.cjs',rollbackCode:plan.targets.rollbackCode,oldCodeHash:proof.rollbackReferenceHash,candidateHash:proof.candidateHash,commit,schemaHash:proof.expectedSchemaHash,knowledgeHash:'0'.repeat(64)});
          for(const entry of Object.values(profile.evidence))entry.commit=commit;
          profile.evidence.configuration.reference='Final user observations; values and EnvFiles path pending approved on-server validation. Zero knowledge hash is review-only; direct replacement requires an approved real knowledge hash before final installation.';
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'control-center-installation-inventory.review.json'),JSON.stringify(profile,null,2)+'\n');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'control-center-manual-package-proof.json'),JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: RiftAssist-v0.2.0-manual-release
          path: ${{ runner.temp }}/RiftAssist-v0.2.0-manual-release/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/download-artifact@v4
        with:
          name: RiftAssist-v0.2.0-manual-release
          path: ${{ runner.temp }}/RiftAssist-v0.2.0-manual-release-downloaded/
      - name: Verify actual uploaded code capsule including hidden baseline files
        run: |
          node - "$RUNNER_TEMP/RiftAssist-v0.2.0-manual-release-downloaded" <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const expected=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'control-center-manual-package-proof.json')));
          const result=require('./staging/replacement-package.cjs').verify(process.argv[2],{expectedPlanHash:expected.planSha256});
          if(result.filesVerified!==expected.filesVerified||result.checksumManifestSha256!==expected.checksumManifestSha256)throw Error('Uploaded capsule differs.');
          const proof={uploadedCapsuleVerified:true,hiddenBaselineFilesPreserved:true,...result};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'control-center-downloaded-capsule-proof.json'),JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: RiftAssist-ControlCenter-ubuntu-ssh-proof
          path: |
            ${{ runner.temp }}/control-center-ubuntu-proof.json
            ${{ runner.temp }}/control-center-real-staging-proof.json
            ${{ runner.temp }}/control-center-replacement-proof.json
            ${{ runner.temp }}/control-center-manual-package-proof.json
            ${{ runner.temp }}/control-center-installation-inventory.review.json
            ${{ runner.temp }}/control-center-downloaded-capsule-proof.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RiftAssist-live-replacement-approval-kit
          path: |
            experiments/unified-rulings/control-center/FINAL-LAUNCH.md
            experiments/unified-rulings/control-center/MINIMUM-LIVE-SCOPE.md
            experiments/unified-rulings/control-center/staging/azure-observations-2026-11-09.json
            ${{ runner.temp }}/control-center-installation-inventory.review.json
            ${{ runner.temp }}/control-center-manual-package-proof.json
          if-no-files-found: error

  one-shot-release-kit:
    if: github.ref == 'refs/heads/release/v0.2.0'
    needs: [windows-validation, ubuntu-ssh-script-validation]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
        working-directory: experiments/unified-rulings/control-center
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: RiftAssist-v0.2.0-manual-release
          path: ${{ runner.temp }}/one-shot-input/capsule
      - uses: actions/download-artifact@v4
        with:
          name: RiftAssist-ControlCenter-ubuntu-ssh-proof
          path: ${{ runner.temp }}/one-shot-input/proofs
      - uses: actions/download-artifact@v4
        with:
          name: RiftAssist-ControlCenter-v0.2.0-win-x64
          path: ${{ runner.temp }}/one-shot-input/windows
      - name: Require successful rules/browser CI for this exact source commit
        env:
          RIFT_CI_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:RIFT_CI_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/rules-tests.yml/runs?head_sha=$env:GITHUB_SHA&per_page=20"
          for ($attempt = 0; $attempt -lt 12; $attempt++) {
            $runs = (Invoke-RestMethod -Uri $url -Headers $headers).workflow_runs
            $run = $runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA -and $_.head_branch -eq 'release/v0.2.0' } | Select-Object -First 1
            if ($run -and $run.status -eq 'completed') { break }
            Start-Sleep -Seconds 5
          }
          if (!$run -or $run.conclusion -ne 'success') { throw 'Exact rules/browser CI has not succeeded; no release kit is published.' }
          "RIFT_RULES_RUN_ID=$($run.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assemble pinned single-entry Windows kit (fail closed until real launch conditions exist)
        run: |
          $inputRoot = Join-Path $env:RUNNER_TEMP 'one-shot-input'
          $out = Join-Path $env:RUNNER_TEMP 'RiftAssist-v0.2.0-one-shot-win-x64'
          node scripts/build-one-shot.cjs "$inputRoot/capsule" "$inputRoot/proofs/control-center-installation-inventory.review.json" "$inputRoot/windows/runtime/node.exe" "$inputRoot/windows/runtime/NODE-LICENSE.txt" $out $env:GITHUB_RUN_ID $env:RIFT_RULES_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Kit verification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: RiftAssist-v0.2.0-one-shot-win-x64
          path: ${{ runner.temp }}/RiftAssist-v0.2.0-one-shot-win-x64/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: RiftAssist-v0.2.0-one-shot-win-x64
          path: ${{ runner.temp }}/RiftAssist-one-shot-downloaded
      - name: Verify uploaded hidden files and execute actual Windows CMD entry without SSH
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'RiftAssist-one-shot-downloaded'
          node -e "const r=require('./scripts/one-shot-release.cjs').inspect(process.argv[1]);if(!r.blockers.includes('source-not-ready')||!r.blockers.includes('approved-legacy-knowledge-missing'))process.exit(1);console.log(JSON.stringify({uploadedKitVerified:true,deployable:false,blockers:r.blockers}));" $out
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded kit failed closed-validation.' }
          $entry = Join-Path $out 'START-RELEASE.cmd'
          $text = ('' | & $entry 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 2 -or $text -notmatch 'NOT DEPLOYABLE:') { throw 'Actual CMD entry did not safely block before SSH.' }
          Write-Output 'Actual Windows CMD and bundled Node executed; missing launch conditions blocked before SSH. No Azure connection or deployment.'
          # The launcher's exit 2 is the asserted safe outcome, not a CI error.
          # GitHub's pwsh wrapper otherwise propagates that last native exit code.
          exit 0
